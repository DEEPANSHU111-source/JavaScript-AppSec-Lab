<!doctype html>
<html>
<head><meta charset="utf-8"><title>Lab 08 - WebSocket Review</title></head>
<body>
<h1>WebSocket Security Review</h1>
<button id="connect">Connect</button>
<button id="send">Send Test Message</button>
<pre id="output"></pre>

<script>
let socket;

document.querySelector("#connect").addEventListener("click", () => {
    socket = new WebSocket("wss://echo.websocket.events/");

    socket.addEventListener("open", () => {
        document.querySelector("#output").textContent = "Connected.";
    });

    socket.addEventListener("message", (event) => {
        document.querySelector("#output").textContent =
            "Received: " + String(event.data);
    });

    socket.addEventListener("error", () => {
        document.querySelector("#output").textContent =
            "Connection error or endpoint unavailable.";
    });
});

document.querySelector("#send").addEventListener("click", () => {
    if (!socket || socket.readyState !== WebSocket.OPEN) {
        document.querySelector("#output").textContent =
            "Connect first.";
        return;
    }

    socket.send(JSON.stringify({
        type: "demo",
        message: "hello"
    }));
});
</script>
</body>
</html>
