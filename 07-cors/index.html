<!doctype html>
<html>
<head><meta charset="utf-8"><title>Lab 07 - CORS Review</title></head>
<body>
<h1>CORS Review</h1>
<pre id="output">Open DevTools → Network while running a real local cross-origin request.</pre>

<script>
async function requestExample() {
    try {
        const response = await fetch("http://127.0.0.1:8001/demo-data.json", {
            credentials: "include"
        });

        document.querySelector("#output").textContent =
            await response.text();
    } catch (error) {
        document.querySelector("#output").textContent =
            "Expected until the second local origin is configured: " + error.message;
    }
}

requestExample();
</script>
</body>
</html>
